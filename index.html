<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ramo de Flores Amarillas</title>
<meta name="description" content="Animación en canvas: un ramo de flores amarillas que crece, florece y se mueve con el viento.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Karla:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="escena" role="img" aria-label="Un ramo de flores amarillas que crece desde su amarre, florece y se mece con el viento"></canvas>

<div class="barra">
  <div>
    <span class="rotulo">Canvas 2D · 60 fps</span>
    <h1 class="titulo">Ramo de flores amarillas</h1>
    <p class="pista">Mueve el cursor para soplar el viento · toca la escena para soltar pétalos.</p>
  </div>
  <button id="replay" class="boton" type="button">Volver a florecer</button>
</div>

<script src="bouquet.js"></script>
</body>
</html>
